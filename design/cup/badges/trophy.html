<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Pangs Cup trophy badge</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent}svg{display:block}body.sheet{background:#0b0614;padding:36px;display:flex;flex-wrap:wrap;gap:28px;width:1934px}body.sheet svg{border-radius:24px}</style>
</head><body>
<script>
const SP='../../../public/sprites/';
const T={
 gold:  {m:['#fff7d6','#ffd166','#d99a26','#7a460b','#ffe7a0'],glow:'#ffb938',label:'CHAMPION',ball:'ball_gold.png',mark:'crown',ink:'#2a1700',confetti:true},
 silver:{m:['#ffffff','#e3e7ef','#a6aebd','#4a5262','#f4f6fa'],glow:'#c9d3e6',label:'2ND PLACE',ball:'ball_silver.png',mark:'laurel',ink:'#1b1f28'},
 bronze:{m:['#ffe2c4','#e6a56b','#b0672e','#552a0d','#ffd0a3'],glow:'#e0904c',label:'3RD PLACE',ball:'ball_brown.png',mark:'laurel',ink:'#2a1305'},
 violet:{m:['#f3eeff','#c3b2ff','#8466f5','#311c86','#ddd2ff'],glow:'#8d6fff',label:'FINALIST',ball:'ball_beta.png',mark:'stars',ink:'#170c3a'},
 steel: {m:['#f0f7ff','#b8d3ee','#6b8fb6','#1f3550','#d9e9f9'],glow:'#5fa8ff',label:'RACER',ball:'ball_blue.png',mark:'ring',ink:'#0c1a2b'},
};
function rnd(seed){let s=seed;return()=>((s=(s*16807)%2147483647)/2147483647);}
function trophy(k,size=1000){
 const t=T[k],m=t.m,id=k,CX=500;
 const star=(x,y,R,r,fill,extra='')=>{let d='';for(let i=0;i<10;i++){const rr=i%2?r:R,a=-Math.PI/2+i*Math.PI/5;d+=(i?'L':'M')+(x+rr*Math.cos(a)).toFixed(1)+' '+(y+rr*Math.sin(a)).toFixed(1);}return `<path d="${d}Z" fill="${fill}" ${extra}/>`;};
 // laurel behind the trophy
 let laurel='';
 if(t.mark!=='stars'&&t.mark!=='ring'){const LX=500,LY=500,R0=372,th0=0.62,step=0.15,n=15;
  for(const s of[-1,1]){const P=(r,a)=>[LX+r*Math.cos(a),LY+r*Math.sin(a)];
   const[sx,sy]=P(R0,Math.PI/2+s*th0),[ex,ey]=P(R0,Math.PI/2+s*(th0+(n-1)*step+.06));
   laurel+=`<path d="M${sx.toFixed(1)} ${sy.toFixed(1)} A${R0} ${R0} 0 0 ${s>0?1:0} ${ex.toFixed(1)} ${ey.toFixed(1)}" fill="none" stroke="${m[3]}" stroke-width="8" stroke-linecap="round"/>`;
   for(let i=0;i<n;i++){const a=Math.PI/2+s*(th0+i*step);const[x,y]=P(R0,a);const dx=-s*Math.sin(a),dy=s*Math.cos(a);const base=Math.atan2(dy,dx)*180/Math.PI+90;const L=62-i*1.7;
    for(const side of[-1,1]){const[ox,oy]=[x+side*7*Math.cos(a),y+side*7*Math.sin(a)];
     laurel+=`<g transform="translate(${ox.toFixed(1)} ${oy.toFixed(1)}) rotate(${(base+side*38).toFixed(1)})"><path d="M0 0 C ${L*.34} ${-L*.38} ${L*.3} ${-L*.86} 0 ${-L*1.1} C ${-L*.3} ${-L*.86} ${-L*.34} ${-L*.38} 0 0Z" fill="url(#leaf-${id})" stroke="${m[3]}" stroke-width="2.4"/><path d="M0 -5 Q ${L*.05} ${-L*.55} 0 ${-L*.98}" fill="none" stroke="${m[3]}" stroke-opacity=".6" stroke-width="2"/></g>`;}
    if(i%3===1){const[bx,by]=P(R0+26,a);laurel+=`<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="7" fill="${m[1]}" stroke="${m[3]}" stroke-width="2"/>`;}}}}
 // ten stars for the ten finalists
 let stars='';
 // every racer: a plain ring of studs (no laurel, no stars: those are for the final)
 if(t.mark==='ring'){for(let i=0;i<28;i++){const a=i*Math.PI*2/28;const x=500+392*Math.cos(a),y=500+392*Math.sin(a);if(y>800)continue;stars+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i%2?7:11}" fill="url(#metal-${id})" stroke="${m[3]}" stroke-width="2"/>`;}}
 if(t.mark==='stars'){for(let i=0;i<10;i++){const a=Math.PI*(1.08+i*0.0933);const x=500+390*Math.cos(a),y=520+390*Math.sin(a);stars+=star(x,y,26,11,`url(#metal-${id})`,`stroke="${m[3]}" stroke-width="2"`);}}
 // confetti for the champion
 let conf='';
 if(t.confetti){const r=rnd(7);const cols=['#ffd166','#fff1b8','#b6a4ff','#4cc9ff','#ff8fb1'];for(let i=0;i<46;i++){const x=40+r()*920,y=30+r()*560;if(Math.abs(x-500)<300&&y>150)continue;conf+=`<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${(8+r()*10).toFixed(0)}" height="${(4+r()*6).toFixed(0)}" rx="2" fill="${cols[i%5]}" opacity="${(.55+r()*.4).toFixed(2)}" transform="rotate(${(r()*180).toFixed(0)} ${x.toFixed(0)} ${y.toFixed(0)})"/>`;}}
 const crown=t.mark==='crown'?`<g transform="translate(500 166)" filter="url(#sh-${id})"><path d="M-62 30 L-72 -30 L-34 2 L0 -48 L34 2 L72 -30 L62 30 Z" fill="url(#metal-${id})" stroke="${m[3]}" stroke-width="4" stroke-linejoin="round"/><rect x="-64" y="28" width="128" height="18" rx="5" fill="url(#metal-${id})" stroke="${m[3]}" stroke-width="4"/>${[-72,0,72].map((x,i)=>`<circle cx="${x}" cy="${i==1?-54:-36}" r="10" fill="#fff4cc" stroke="${m[3]}" stroke-width="3"/>`).join('')}<circle cx="0" cy="10" r="8" fill="#b6a4ff" stroke="${m[3]}" stroke-width="2"/></g>`:'';
 return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 1000 1000">
<defs>
 <radialGradient id="bg-${id}" cx="50%" cy="40%" r="72%"><stop offset="0" stop-color="${t.glow}" stop-opacity=".30"/><stop offset=".42" stop-color="#1b0e36"/><stop offset="1" stop-color="#06030c"/></radialGradient>
 <linearGradient id="beam-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${m[0]}" stop-opacity=".22"/><stop offset="1" stop-color="${m[0]}" stop-opacity="0"/></linearGradient>
 <linearGradient id="bowl-${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${m[3]}"/><stop offset=".1" stop-color="${m[2]}"/><stop offset=".24" stop-color="${m[0]}"/><stop offset=".34" stop-color="${m[1]}"/><stop offset=".58" stop-color="${m[2]}"/><stop offset=".78" stop-color="${m[3]}"/><stop offset=".9" stop-color="${m[2]}"/><stop offset="1" stop-color="${m[3]}"/></linearGradient>
 <linearGradient id="shade-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".55" stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".42"/></linearGradient>
 <linearGradient id="metal-${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${m[0]}"/><stop offset=".35" stop-color="${m[1]}"/><stop offset=".7" stop-color="${m[2]}"/><stop offset="1" stop-color="${m[3]}"/></linearGradient>
 <linearGradient id="leaf-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${m[0]}"/><stop offset=".55" stop-color="${m[1]}"/><stop offset="1" stop-color="${m[2]}"/></linearGradient>
 <linearGradient id="hl-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <radialGradient id="halo-${id}" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="${t.glow}" stop-opacity=".5"/><stop offset="1" stop-color="${t.glow}" stop-opacity="0"/></radialGradient>
 <radialGradient id="cupin-${id}" cx="50%" cy="30%" r="70%"><stop offset="0" stop-color="${m[3]}"/><stop offset="1" stop-color="#0d0718"/></radialGradient>
 <filter id="sh-${id}" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
 <filter id="soft-${id}"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1000" height="1000" fill="url(#bg-${id})"/>
<path d="M430 -40 L570 -40 L820 1000 L180 1000 Z" fill="url(#beam-${id})" opacity=".7"/>
<path d="M300 -40 L360 -40 L120 1000 L-60 1000 Z M640 -40 L700 -40 L1060 1000 L880 1000 Z" fill="url(#beam-${id})" opacity=".35"/>
${conf}
<circle cx="500" cy="430" r="330" fill="url(#halo-${id})"/>
${laurel}${stars}
<ellipse cx="500" cy="842" rx="260" ry="34" fill="${t.glow}" opacity=".28" filter="url(#soft-${id})"/>
<g filter="url(#sh-${id})">
 <!-- handles -->
 <path d="M334 392 C 232 372 214 520 372 540" fill="none" stroke="${m[3]}" stroke-width="30" stroke-linecap="round"/>
 <path d="M334 392 C 232 372 214 520 372 540" fill="none" stroke="url(#metal-${id})" stroke-width="20" stroke-linecap="round"/>
 <path d="M666 392 C 768 372 786 520 628 540" fill="none" stroke="${m[3]}" stroke-width="30" stroke-linecap="round"/>
 <path d="M666 392 C 768 372 786 520 628 540" fill="none" stroke="url(#metal-${id})" stroke-width="20" stroke-linecap="round"/>
 <!-- inside of the cup, then the ball, then the front of the bowl -->
 <ellipse cx="500" cy="364" rx="176" ry="36" fill="url(#cupin-${id})"/>
 <image href="${SP}${t.ball}" x="372" y="190" width="256" height="256"/>
 <path d="M324 364 A176 36 0 0 0 676 364 C 676 478 612 566 534 596 L466 596 C 388 566 324 478 324 364 Z" fill="url(#bowl-${id})"/>
 <path d="M324 364 A176 36 0 0 0 676 364 C 676 478 612 566 534 596 L466 596 C 388 566 324 478 324 364 Z" fill="url(#shade-${id})"/>
 <path d="M372 410 C 372 470 392 520 430 556" fill="none" stroke="url(#hl-${id})" stroke-width="14" stroke-linecap="round" opacity=".8"/>
 <path d="M324 364 A176 36 0 0 0 676 364" fill="none" stroke="${m[0]}" stroke-width="12" stroke-linecap="round"/>
 <path d="M324 364 A176 36 0 0 0 676 364" fill="none" stroke="${m[3]}" stroke-width="3" transform="translate(0 7)" opacity=".7"/>
 <!-- engraved band -->
 <path id="band-${id}" d="M330 466 Q500 500 670 466" fill="none"/>
 <path d="M360 446 Q500 478 640 446" fill="none" stroke="${m[3]}" stroke-opacity=".55" stroke-width="3"/>
 <path d="M366 498 Q500 530 634 498" fill="none" stroke="${m[3]}" stroke-opacity=".55" stroke-width="3"/>
 <text font-family="Outfit" font-weight="900" font-size="36" letter-spacing="6" fill="${m[0]}" opacity=".9" transform="translate(0 2)"><textPath href="#band-${id}" startOffset="50%" text-anchor="middle">PANGS CUP</textPath></text>
 <text font-family="Outfit" font-weight="900" font-size="36" letter-spacing="6" fill="${m[3]}"><textPath href="#band-${id}" startOffset="50%" text-anchor="middle">PANGS CUP</textPath></text>
 <!-- stem and base -->
 <ellipse cx="500" cy="600" rx="56" ry="17" fill="url(#metal-${id})" stroke="${m[3]}" stroke-width="3"/>
 <path d="M472 612 C 488 636 488 654 452 680 L548 680 C 512 654 512 636 528 612 Z" fill="url(#bowl-${id})"/>
 <ellipse cx="500" cy="682" rx="84" ry="16" fill="url(#metal-${id})" stroke="${m[3]}" stroke-width="3"/>
 <path d="M412 694 L588 694 L612 732 L388 732 Z" fill="url(#bowl-${id})" stroke="${m[3]}" stroke-width="3"/>
 <rect x="330" y="732" width="340" height="112" rx="10" fill="url(#bowl-${id})" stroke="${m[3]}" stroke-width="4"/>
 <rect x="330" y="732" width="340" height="112" rx="10" fill="url(#shade-${id})"/>
 <rect x="350" y="748" width="300" height="80" rx="8" fill="#140b26" stroke="${m[1]}" stroke-width="3"/>
 <text x="500" y="803" text-anchor="middle" font-family="Outfit" font-weight="900" font-size="${t.label.length>8?40:46}" letter-spacing="4" fill="${m[1]}">${t.label}</text>
</g>
${crown}
${star(150,330,9,3.5,'#fff','opacity=".7"')}${star(860,260,12,4.5,'#fff','opacity=".8"')}${star(820,560,7,3,'#fff','opacity=".6"')}${star(190,610,8,3,'#fff','opacity=".55"')}
<text x="500" y="920" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="28" letter-spacing="8" fill="${m[1]}" opacity=".85">CUP #1 · BETA SEASON 2026</text>
</svg>`;}
const q=new URLSearchParams(location.search);
if(q.get('sheet')){document.body.className='sheet';const ks=['gold','silver','bronze','violet','steel'];document.body.insertAdjacentHTML('beforeend',ks.map(k=>trophy(k,350)).join('')+'<div style="width:100%"></div>'+ks.map(k=>trophy(k,160)).join('')+ks.map(k=>trophy(k,72)).join(''));}
else document.body.insertAdjacentHTML('beforeend',trophy(q.get('t')||'gold'));
</script></body></html>
